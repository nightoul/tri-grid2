<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Tri-Grid s.r.o.</title>
  <script type="text/javascript">
    // Standardní "spa-github-pages" obchvat: GitHub Pages neumí přesměrovat
    // neznámé cesty zpět na index.html na serveru, takže to uděláme tímhle
    // skriptem — zakóduje aktuální cestu do query stringu a přesměruje na
    // index.html, který si ji v <head> zase rozbalí zpět.
    var pathSegmentsToKeep = 1; // odpovídá /tri-grid2/ v URL
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
